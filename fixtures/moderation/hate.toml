# real-world groups. No slurs. Hostility between the Tower's own peoples is
# in-world and belongs in allowed.toml.
#
# Lines marked HateCheck come from the hateful test cases of HateCheck
# (Röttger et al., ACL 2021; github.com/paul-rottger/hatecheck-data) and the
# German suite of Multilingual HateCheck (Röttger et al., WOAH 2022;
# github.com/rewire-online/multilingual-hatecheck), both CC BY 4.0. Selection:
# ten functionalities (no slurs, profanity or spelling obfuscations); per
# functionality the first two templates are examples and the third is
# held out, so held-out lines come from templates never used as examples.
# Owner-reviewed lists (plans/npc-guardrails-2026-11-17.md, Task 12).
