# Thresholds of the nearest-neighbour moderator (theos-ai KnnModerator).
# A text is blocked with a category when its best similarity to that
# category's examples is at least `min_similarity` and beats its best
# similarity to allowed.toml by at least `margin`.
# Tuned with `npc-poc moderation-tune` (Task 12 of
# plans/npc-guardrails-2026-11-17.md): grid search under the real decision
# rule; on the held-out lines (a tuning fit, not a held-out estimate) it
# catches 37 of 56 banned lines and blocks 0 of 16 allowed lines (re-tuned
# 2026-11-18 after the hate expansion and the minimum piece length; same
# values). The reply values are copied from the player side (untuned).

[player]
min_similarity = 0.54
margin = 0.14

[reply]
min_similarity = 0.54
margin = 0.14
