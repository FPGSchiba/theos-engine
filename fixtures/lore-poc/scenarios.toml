# Scenarios of the lore-poc fixture. README.md explains every field.
# PoC fixture, not canon.

# Words no speaker has ever heard (canon rule 5). Matched as whole words in any case;
# plurals are not matched.
forbid_words = ["node", "edge", "graph", "frequency"]

# How many records retrieval may return. The expected records must be among them.
top_k = 5

[[scenario]]
id = "s01"
npc = "fx-binder"
question = "The air wobbles when I sing to the spirit. What am I doing wrong?"
behaviour = "answer"
expect = ["B-944"]
also_ok = ["B-943", "B-942"]
forbid = ["T-917", "C-905"]
note = "The Quarrel. The truth behind it is the nearest developer record."

