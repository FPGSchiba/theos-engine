# Scenarios of the bt-poc fixture. README.md explains every field and check.
# PoC fixture, synthetic, not canon.

# Seconds between two ticks of the tree.
tick_seconds = 0.5

# Generation budget per priority, from the AI Latency Budget page (140181505).
budget_seconds = { WorldEvent = 30.0, CombatTactical = 8.0 }

[[scenario]]
id = "b01"
actor = "fx-hedge-scribe"
tags = ["lore"]
priority = "WorldEvent"
duration = 7.0
directive = "Keep the ward-glyphs on the workshop door fresh: carve one whenever you can. Raiders have been seen on the road."
lore_expect = ["B-918"]
also_ok = ["B-917", "B-914", "B-916"]
rejects = []
note = "The Scribes carve only when calm. The directive says carve whenever you can; only the lore says not while threatened."
trace = [
  { "at" = 2.0, "distances" = { "raider" = 12.0 }, "set_flags" = ["threatened"] },
  { "at" = 4.5, "distances" = { "raider" = 70.0 }, "clear_flags" = ["threatened"] },
]

[scenario.world]
health = 1.0
flags = []
entities = [
  { "handle" = "workshop-door", "kind" = "place", "distance" = 2.0 },
  { "handle" = "cellar", "kind" = "cover", "distance" = 8.0 },
  { "handle" = "raider", "kind" = "foe", "distance" = 60.0 },
]

[scenario.flags]
"threatened" = "an armed stranger is close and means you harm"

[[scenario.check]]
kind = "event"
to = 1.5
event = "CarveRune"
why = "carves while calm"

[[scenario.check]]
kind = "no_event"
from = 2.0
to = 4.0
event = "CarveRune"
why = "never carves while threatened"

[[scenario.check]]
kind = "event"
from = 4.5
event = "CarveRune"
why = "carves again once calm"

