name: Test with Code Coverage

on:
  pull_request:
  push:
    branches:
      - main
      - development

permissions:
  contents: read
  issues: read
  checks: write
  pull-requests: write

jobs:
  test:
    name: Test
    env:
      CARGO_INCREMENTAL: 0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly

      # Fast installation of pre-compiled binaries
      - name: Install coverage tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin,cargo2junit

      # The launcher's `tests/lifecycle.rs` end-to-end test drives the
      # actual `theos-launcher` binary through its full startup → run →
      # shutdown sequence via winit. winit needs a display server; on the
      # headless Linux runner we provide one via xvfb. All other tests
      # (unit, kernel-integration, logging-layer) are unaffected by this.
      - name: Install xvfb (for headed launcher lifecycle test)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Generate test result and coverage report
        run: |
          echo "::info Running tests with coverage";
          xvfb-run -a cargo +nightly tarpaulin --all-features --workspace --timeout 120 --out xml

          echo "::info Generating JUnit results";
          xvfb-run -a cargo +nightly test --workspace --all-features -- -Z unstable-options --format json | cargo2junit > results.xml

      - name: Upload test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          check_name: Test Results
          files: results.xml

      - name: Upload to CodeCov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true