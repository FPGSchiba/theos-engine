name: Check and Lint

on:
  pull_request:
  push:
    branches:
      - "**"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo check --workspace --all-targets

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt

      - name: Format workspace
        run: cargo fmt --all

      - name: Verify formatting (ignore blank-line-only churn)
        run: |
          git --no-pager diff --ignore-blank-lines --ignore-space-at-eol --exit-code \
            || { echo "::error::Formatting drift detected (excluding blank-line/EOL-only changes)."; exit 1; }

  clippy-and-policy:
    name: Clippy & Unsafe Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy

      - name: Clippy (Enforce Spec §6.4 Unsafe Lints)
        run: >
          cargo clippy --workspace --all-targets -- 
          -D clippy::undocumented_unsafe_blocks 
          -D clippy::multiple_unsafe_ops_per_block 
          -D warnings

      - name: Forbid-unsafe verification
        run: |
          for c in theos-shared theos-ecs theos-assets theos-ai theos-scripting \
                   theos-render theos-physics theos-core theos-launcher \
                   theos-editor theos-game; do
            grep -q "^#!\[forbid(unsafe_code)\]" "$c/src/lib.rs" "$c/src/main.rs" 2>/dev/null \
              || { echo "::error::$c is missing #![forbid(unsafe_code)]"; exit 1; }
          done

      - name: Install cargo-geiger
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-geiger

      - name: Unsafe audit (cargo-geiger)
        run: |
          set -euo pipefail
          mapfile -t manifests < <(cargo metadata --no-deps --format-version 1 | python3 -c "import json,sys; m=json.load(sys.stdin); ws=set(m['workspace_members']); paths=sorted({p['manifest_path'] for p in m['packages'] if p['id'] in ws}); [print(x) for x in paths]")

          if [ "${#manifests[@]}" -eq 0 ]; then
            echo "::error::No workspace package manifests found for cargo-geiger."
            exit 1
          fi

          for manifest in "${manifests[@]}"; do
            crate_dir="$(dirname "$manifest")"
            crate_name="$(basename "$crate_dir")"
            echo "::group::cargo-geiger :: ${crate_name}"
            (cd "$crate_dir" && cargo geiger --all-features --manifest-path "$manifest")
            echo "::endgroup::"
          done
