[package]
name = "theos-core"
version = "0.1.0"
edition = "2021"

[dependencies]
theos-shared = { workspace = true }
semver = { workspace = true }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt", "time"] }
time = "0.3.47"
tokio = { workspace = true }
rayon = "1.12.0"
ctrlc = "3.5.2"
parking_lot = "0.12.5"

[dev-dependencies]
criterion = "0.8.2"
alloc_count = "0.3.1"
seq-macro = "0.3"

[[bench]]
name = "event_bus"
harness = false

[[bench]]
name = "event_bus_alloc"
harness = true

[[bench]]
name = "frame_timing"
harness = false