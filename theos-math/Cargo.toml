[package]
name = "theos-math"
version = "0.1.0"
edition = "2024"

[dependencies]
mint = "0.5"
glam = "0.32.1"
bytemuck = { version = "1.25.0", features = ["derive"] }
wide = { version = "1.3.0", optional = true }
num-traits = "0.2"

[lints]
workspace = true

[features]
default = [] # No features enabled by default
simd = ["dep:wide"]    # Defines the 'simd' feature

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "math_benches"
harness = false