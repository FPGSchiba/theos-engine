[package]
name = "bt-poc"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
theos-ai = { path = "../../../theos-ai", features = ["testkit"] }
theos-ai-llama = { path = "../theos-ai-llama" }
guard-kit = { path = "../guard-kit" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
anyhow = "1"

[dev-dependencies]
jsonschema = { version = "0.61", default-features = false }
