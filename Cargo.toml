[workspace]
resolver = "2"
members = [
    "theos-shared", "theos-math",
    "theos-core", "theos-ecs", "theos-assets", "theos-render", "theos-physics", "theos-ai", "theos-scripting",
    "theos-plugin-api", "theos-plugin-loader",
    "theos-launcher", "theos-editor", "theos-game"
]

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

[workspace.dependencies]
# --- Internal (FIXED) ---
theos-shared        = { path = "theos-shared" }
theos-math          = { path = "theos-math" }
theos-core          = { path = "theos-core" }
theos-ecs           = { path = "theos-ecs" }
theos-assets        = { path = "theos-assets" }
theos-render        = { path = "theos-render" }
theos-physics       = { path = "theos-physics" }
theos-ai            = { path = "theos-ai" }
theos-scripting     = { path = "theos-scripting" }
theos-plugin-api    = { path = "theos-plugin-api" }
theos-plugin-loader = { path = "theos-plugin-loader" }

# --- Kernel & Concurrency ---
rayon               = "1"
tokio               = { version = "1", features = ["rt-multi-thread", "rt", "sync", "time", "macros", "fs", "io-util"] }
crossbeam           = "0.8"
parking_lot         = "0.12"
semver              = "1"
# --- Math & POD casting ---
glam                = "0.27"
bytemuck            = { version = "1", features = ["derive"] }
# --- ECS & Assets ---
hecs                = "0.10"
uuid                = { version = "1", features = ["v4", "serde"] }
notify              = "6"
serde               = { version = "1", features = ["derive"] }
serde_json          = "1"
schemars            = { version = "0.8", features = ["uuid1"] }
jsonschema          = "0.18"
# --- Rendering (in-process) ---
wgpu                = "0.20"
winit               = "0.29"
naga                = "0.20"
# --- AI / RAG ---
reqwest             = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
usearch             = "2"
fastembed           = "3"
rusqlite            = { version = "0.31", features = ["bundled", "blob"] }
# --- Plugin SDK ---
abi_stable          = "0.11"
libloading          = "0.8"
wasmtime            = "20"
async_ffi           = "0.5"
# --- Editor IPC ---
postcard            = { version = "1", features = ["use-std"] }
shared_memory       = "0.12"
# --- Logging & Errors ---
tracing             = "0.1"
tracing-subscriber  = { version = "0.3", features = ["env-filter", "json", "fmt", "time"] }
thiserror           = "1"
# --- Editor shell ---
tauri               = { version = "2", features = [] }
egui                = "0.27"
